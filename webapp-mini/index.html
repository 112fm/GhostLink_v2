<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GhostLink</title>
  <meta http-equiv="refresh" content="0; url=../webapp-mini-v2/" />
  <script>
    (function () {
      var target = "../webapp-mini-v2/";
      try {
        var qs = window.location.search || "";
        var hash = window.location.hash || "";
        window.location.replace(target + qs + hash);
      } catch (_) {
        window.location.href = target;
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <a href="../webapp-mini-v2/">Перейти в GhostLink Mini App</a>
  </noscript>
</body>
</html>
